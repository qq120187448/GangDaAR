name: Build Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "GangDaARNative/**"
      - ".github/workflows/build-ipa-native.yml"

jobs:
  build-native-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd GangDaARNative && xcodegen generate

      - name: Import signing certificate
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No signing certificate configured, building unsigned IPA"
            exit 0
          fi
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          KEYCHAIN_PASSWORD="build-keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          cd GangDaARNative
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ]; then
            xcodebuild \
              -project GangDaAR.xcodeproj \
              -scheme GangDaAR \
              -configuration Release \
              -destination generic/platform=iOS \
              -archivePath build/GangDaAR.xcarchive \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              archive

            EXPORT_METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
            plutil -create xml1 export-options.plist
            plutil -insert method -string "$EXPORT_METHOD" export-options.plist
            plutil -insert signingStyle -string manual export-options.plist
            plutil -insert teamID -string "$IOS_TEAM_ID" export-options.plist
            plutil -insert compileBitcode -bool NO export-options.plist
            xcodebuild \
              -exportArchive \
              -archivePath build/GangDaAR.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist export-options.plist \
              -allowProvisioningUpdates
          else
            xcodebuild \
              -project GangDaAR.xcodeproj \
              -scheme GangDaAR \
              -configuration Release \
              -destination generic/platform=iOS \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              build
            mkdir -p build/export/Payload
            ditto build/DerivedData/Build/Products/Release-iphoneos/GangDaAR.app build/export/Payload/GangDaAR.app
            (cd build/export && zip -qry GangDaAR-unsigned.ipa Payload)
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GangDaAR-Native-iOS
          path: |
            GangDaARNative/build/export/*.ipa
          if-no-files-found: error
