name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate iOS project
        run: CI=1 npx expo prebuild --platform ios --clean

      - name: Import signing certificate
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "No signing certificate configured, building unsigned IPA"
            exit 0
          fi
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          KEYCHAIN_PASSWORD="build-keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | /usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin)
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          if [ -n "${IOS_CERTIFICATE_BASE64:-}" ]; then
            xcodebuild \
              -workspace ios/GangDaAR.xcworkspace \
              -scheme GangDaAR \
              -configuration Release \
              -archivePath build/GangDaAR.xcarchive \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              archive

            EXPORT_METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
            plutil -create xml1 export-options.plist
            plutil -insert method -string "$EXPORT_METHOD" export-options.plist
            plutil -insert signingStyle -string manual export-options.plist
            plutil -insert teamID -string "$IOS_TEAM_ID" export-options.plist
            plutil -insert compileBitcode -bool NO export-options.plist
            xcodebuild \
              -exportArchive \
              -archivePath build/GangDaAR.xcarchive \
              -exportPath build/export \
              -exportOptionsPlist export-options.plist \
              -allowProvisioningUpdates
          else
            xcodebuild \
              -workspace ios/GangDaAR.xcworkspace \
              -scheme GangDaAR \
              -configuration Release \
              -archivePath build/GangDaAR-unsigned.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive

            mkdir -p build/unsigned/Payload
            cp -R build/GangDaAR-unsigned.xcarchive/Products/Applications/GangDaAR.app build/unsigned/Payload/
            cd build/unsigned
            zip -qry ../GangDaAR-unsigned.ipa Payload
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GangDaAR-iOS
          path: |
            build/export/*.ipa
            build/GangDaAR-unsigned.ipa
          if-no-files-found: warn
