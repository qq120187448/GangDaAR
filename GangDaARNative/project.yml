name: GangDaAR
options:
  bundleIdPrefix: com.gangda
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  GangDaAR:
    type: application
    platform: iOS
    sources:
      - path: GangDaAR
    resources:
      - path: Models
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gangda.arnative
        PRODUCT_NAME: GangDaAR
        INFOPLIST_FILE: GangDaAR/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  GangDaAR:
    build:
      targets:
        GangDaAR: all
    run:
      config: Debug
    archive:
      config: Release
